services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_gosen
    ports:
      - "5432:5432"
    volumes:
      - coffee_gosen_data:/var/lib/postgresql/data

volumes:
  coffee_gosen_data: